  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);

  const isArray = Array.isArray;

  );

      typeof nextState !== &quot;object&quot; ||

          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||

      typeof parsedState !== &quot;object&quot; ||

        return () =&gt; {};

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;

      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };

    postToHost(&quot;height&quot;, {

          document.body.scrollHeight,

        ),

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {

      const source = apply(getMessageSource, event, []);

        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||

      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {

              if (typeof id !== &quot;number&quot;) {
                return;
              }

              if (pending != null) {
                pendingStateWrites.delete(id);

                }

      }

2,2976,256,32],[3040,3008,320,32],[3008,3040,384,32],[3008,3072,384,32],[3040,3104,384,32],[3040,3136,384,32],[3040,3168,352,32],[3072,3200,288,32],[3072,3232,256,32],[3104,3264,224,32],[4032,3360,128,32],[4032,3392,224,32],[4000,3424,288,32],[4000,3456,288,32],[3968,3488,352,32],[5152,3488,160,32],[3968,3520,352,32],[5120,3520,224,32],[4000,3552,320,32],[5120,3552,224,32],[4000,3584,320,32],[5088,3584,288,32],[4000,3616,288,32],[5120,3616,224,32],[4000,3648,256,32],[5120,3648,224,32],[4096,3680,128,32],[5152,3680,160,32],[5184,3712,96,32]],&quot;housingEstimate&quot;:{&quot;candidateCells&quot;:4287744,&quot;focusCandidateCells&quot;:1222208,&quot;method&quot;:&quot;Сетка 8 м, условные отступы; отображение полосами 32 м. Без уклонов, домов, статик и проверки размеров участков. Это верхняя оценка кандидатов, не число домов.&quot;},&quot;technical&quot;:{&quot;oldBoatWrapX&quot;:5104,&quot;surfaceEast&quot;:6144,&quot;reserveIsWater&quot;:false,&quot;serverChanged&quot;:false,&quot;ingotWeightChosen&quot;:null,&quot;ingotWeightProposed&quot;:0.5,&quot;currentIngotWeight&quot;:0.1,&quot;bigOreWeight&quot;:12,&quot;bigOreIngotYield&quot;:2}}&lt;/script&gt;
&lt;script type=&quot;application/json&quot; id=&quot;vetla-questions&quot;&gt;[{&quot;id&quot;:&quot;Q01&quot;,&quot;title&quot;:&quot;Проходимая суша&quot;,&quot;text&quot;:&quot;Ориентир 6–8 млн сохраняется. Северная перемычка и новые проходы требуют пересчёта площади. Маска эскиза не заменяет проверку клеточной проходимости после экспорта.&quot;},{&quot;id&quot;:&quot;Q02&quot;,&quot;title&quot;:&quot;Защита новичка&quot;,&quot;text&quot;:&quot;Предлагаю отдельно рассмотреть охрану Переброда и деревни, оставив риск на пути к руде. Границы стражи ещё не заданы; услуги заставы не означают охрану брода.&quot;},{&quot;id&quot;:&quot;Q03&quot;,&quot;title&quot;:&quot;Онлайн и рынки&quot;,&quot;text&quot;:&quot;Переброд, Борницы и Острог — три стартовых рынка. Проверять реальный оборот и местный спрос. Онлайн из сводки — допущение; рынок Гавани открывается по спросу.&quot;},{&quot;id&quot;:&quot;Q04&quot;,&quot;title&quot;:&quot;Вес слитков&quot;,&quot;text&quot;:&quot;Увеличение веса слитков выбрано; 0,5 камня пока только предложение. 300 слитков = 150 камней, 1000 = 500. Проверить крафт, транспорт, товарные чеки и магию. Серверный вес не изменён.&quot;},{&quot;id&quot;:&quot;Q05&quot;,&quot;title&quot;:&quot;Корабли вместо парома&quot;,&quot;text&quot;:&quot;По решению автора третья связь берегов — только корабли игроков. Открыты вместимость, погрузка, наём, причалы и пиратство. Сравнивать весь морской рейс с сухопутной доставкой.&quot;},{&quot;id&quot;:&quot;Q06&quot;,&quot;title&quot;:&quot;Несудоходная Ветла&quot;,&quot;text&quot;:&quot;В v4 корабли ходят по заливу и морю, Ветла несудоходна. У устья нужна читаемая физическая граница, проверенная с размерами корпуса и возможностью разворота.&quot;},{&quot;id&quot;:&quot;Q07&quot;,&quot;title&quot;:&quot;Снег и степь&quot;,&quot;text&quot;:&quot;Пещеры (2700,280) находятся в расширенном снежном ущелье, связанном со Скитом. 639 м от Скита и более 500 м от брода, заставы и торговой дороги. Наружные спавны и тропы проверить в игре.&quot;},{&quot;id&quot;:&quot;Q08&quot;,&quot;title&quot;:&quot;Острова и Навь&quot;,&quot;text&quot;:&quot;Китеж и Буян — позже, Навь — за кряжем. Руда Китежа должна оставлять смысл импорту. До открытия Буяна нужно исправить серверные границы плавания.&quot;},{&quot;id&quot;:&quot;Q09&quot;,&quot;title&quot;:&quot;Выходы Черноречья&quot;,&quot;text&quot;:&quot;ЮВ выход стоит на явной сухой площадке 100 × 100 м с гатью к Пристани. Разнос выходов не исключает кемпинг: нужны внутренние пути, укрытия и проверка в игре.&quot;},{&quot;id&quot;:&quot;Q10&quot;,&quot;title&quot;:&quot;Дома и гильдии&quot;,&quot;text&quot;:&quot;Жильё рассматривается на свободной проходимой земле вне запретных зон. Площадь не равна числу домов: нужны фундаменты, отступы и подъезды. Три прежних резерва оставлены под гильдейские базы.&quot;},{&quot;id&quot;:&quot;Q11&quot;,&quot;title&quot;:&quot;Внутренние области&quot;,&quot;text&quot;:&quot;4,19 млн клеток служебной полосы — резерв. Считать все этажи, переходы и промежутки, учитывая поверхностные места охоты. Два внешних подхода ещё не задают внутренние связи подземелья.&quot;},{&quot;id&quot;:&quot;Q12&quot;,&quot;title&quot;:&quot;Время и диагонали&quot;,&quot;text&quot;:&quot;Метры и шаги UO считаются отдельно: шаги сегмента — max(|ΔX|, |ΔY|). Время при 5 и 10 шагах/с не включает бой, погрузку, препятствия и скорость гружёного транспорта.&quot;},{&quot;id&quot;:&quot;Q13&quot;,&quot;title&quot;:&quot;Непроходимые преграды&quot;,&quot;text&quot;:&quot;Северная перемычка должна блокировать и диагональные обходы. Повторить поиск пути при закрытых переправах по экспортированной карте. Декоративная гора не заменяет серверную коллизию; корабельный проход под мостом не планируется.&quot;},{&quot;id&quot;:&quot;Q14&quot;,&quot;title&quot;:&quot;Магия и тяжёлый металл&quot;,&quot;text&quot;:&quot;Тяжёлые слитки не исключают много малых Recall-рейсов, Gate и распределение груза между игроками. Проверить контейнеры, животных, лимиты, стоимость и частоту рейсов до вывода о спросе на караваны.&quot;},{&quot;id&quot;:&quot;Q15&quot;,&quot;title&quot;:&quot;Капища&quot;,&quot;text&quot;:&quot;Общие врата пока не размещены. Они изменят поток налегке даже при тяжёлом металле. Решать после проверки пеших маршрутов, торговли и магических перевозок.&quot;},{&quot;id&quot;:&quot;Q16&quot;,&quot;title&quot;:&quot;Лагеря и тихие земли&quot;,&quot;text&quot;:&quot;23 промежуточные точки сохраняются. После переноса данжей заново проверить расстояния до занятий. Отличать полезные тихие земли под дома от пустот; метка без награды или услуги не создаёт занятие.&quot;},{&quot;id&quot;:&quot;Q17&quot;,&quot;title&quot;:&quot;Границы плавания&quot;,&quot;text&quot;:&quot;Старый предел X = 5104 не подходит поверхности шириной 6144. Нужны отдельные границы мира и выбранное поведение края. Служебная полоса закрывается непроходимой пустотой; сервер пока не изменён.&quot;},{&quot;id&quot;:&quot;Q18&quot;,&quot;title&quot;:&quot;Первая очередь&quot;,&quot;text&quot;:&quot;Курганы и лекарь Низовий включены в первую очередь. Хозяйство хутора — во вторую. Минимальный прототип — круг новичка; лекарь находится в 358 м от Курганов по прямой.&quot;},{&quot;id&quot;:&quot;Q19&quot;,&quot;title&quot;:&quot;Экспорт и проверка&quot;,&quot;text&quot;:&quot;Проверить связность, расстояния, подходы и пригодность земли для домов, затем повторить по серверной карте. Добавить плавание и перезапуск. Целевой онлайн требует отдельных нагрузочных тестов.&quot;},{&quot;id&quot;:&quot;Q20&quot;,&quot;title&quot;:&quot;Рабочее имя&quot;,&quot;text&quot;:&quot;Ветлинские земли — название карты, The Verge — рабочее имя проекта. Географические названия и специализации остаются частью эскиза; порядок переноса игрового функционала не меняется.&quot;}]&lt;/script&gt;

else if(state.route===&#x27;navigation&#x27;)info.textContent=&#x27;Корабли игроков: залив и море. Ветла несудоходна. Красная линия — действующая старая граница кораблей X=5104; её настройка для своего мира ещё не внесена в сервер. Резерв справа — непроходимая пустота.&#x27;;
else info.textContent=`Проходимая суша ≈ ${(D.areaEstimate.walkableCells/1e6).toFixed(2)} млн (${D.areaEstimate.walkablePercent}%) по условной маске; пунктирный контур — предложение первой очереди.`;
document.getElementById(&#x27;vetla-answer&#x27;).textContent=Q.find(q=&gt;q.id===state.question)?.text||&#x27;&#x27;;
}
routeSelect.addEventListener(&#x27;change&#x27;,()=&gt;{state.route=routeSelect.value;state.place=({novice:&#x27;p&#x27;,trade:&#x27;bridge&#x27;,loot:&#x27;ruins&#x27;,overview:&#x27;p&#x27;,housing:&#x27;n&#x27;,navigation:&#x27;u&#x27;})[state.route];draw();save()});
placeSelect.addEventListener(&#x27;change&#x27;,()=&gt;{state.place=placeSelect.value;const n=nodes[state.place],b=boxes[state.route];if(n.x&lt;b[0]||n.x&gt;b[2]||n.y&lt;b[1]||n.y&gt;b[3])state.route=&#x27;overview&#x27;;draw();save()});

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  const isShare = document.documentElement.classList.contains(
    "visualization-share-root",
  );
  let viewportHeight = globalThis.innerHeight;
  let sizeFingerprint = null;
  let sizeWriteTimeout;
  let lastSize = null;
  let pendingSize = null;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const sizeStorageKey = `${storageKey}:share-size-v1`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const persistSize = () => {
    globalThis.clearTimeout(sizeWriteTimeout);
    if (pendingSize == null) {
      return;
    }
    try {
      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }
    pendingSize = null;
  };
  if (isShare) {
    globalThis.addEventListener("pagehide", persistSize);
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
