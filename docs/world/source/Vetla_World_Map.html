      typeof nextState !== &quot;object&quot; ||

          typeof value === &quot;function&quot; ||

    &quot;message&quot;,
    (event) =&gt; {

          &quot;message&quot;,

&lt;script type=&quot;application/json&quot; id=&quot;vetla-questions&quot;&gt;[{&quot;id&quot;:&quot;Q01&quot;,&quot;title&quot;:&quot;Проходимая суша&quot;,&quot;text&quot;:&quot;6–8 млн клеток — 23,8–31,8% поверхности. Считать воду, непроходимые области и оставшуюся сушу отдельно. Геометрическая оценка схемы не заменяет проверку игровой проходимости.&quot;},{&quot;id&quot;:&quot;Q02&quot;,&quot;title&quot;:&quot;Защита новичка&quot;,&quot;text&quot;:&quot;Короткий круг без переправ не гарантирует защиту от PvP. Нужно определить стражу, лекаря и восстановление после потери вещей. Услуги заставы не означают охрану брода.&quot;},{&quot;id&quot;:&quot;Q03&quot;,&quot;title&quot;:&quot;Онлайн и рынки&quot;,&quot;text&quot;:&quot;Хватит ли спроса на три рынка? Онлайн из сводки — допущение. Предлагаю проверять оборот; деревням оставить услуги, а четвёртый рынок Гавани открыть вместе с устойчивым морским спросом.&quot;},{&quot;id&quot;:&quot;Q04&quot;,&quot;title&quot;:&quot;Выгода перевозки&quot;,&quot;text&quot;:&quot;Какой бонус Переброда окупит дорогу из Острога? Сравнить перевозку руды и слитков с риском потери. Спрос на припасы Низовий не должен предполагать ещё не выбранные механики питания и корма.&quot;},{&quot;id&quot;:&quot;Q05&quot;,&quot;title&quot;:&quot;Южный паром&quot;,&quot;text&quot;:&quot;Паром — предложение v2. Перевозит ли он животных и груз, сколько стоит и ждёт? Быстрый гарантированный рейс может обесценить выбор моста и брода.&quot;},{&quot;id&quot;:&quot;Q06&quot;,&quot;title&quot;:&quot;Судоходство&quot;,&quot;text&quot;:&quot;Где предел движения вверх по Ветле? Проход под мостом не подтверждён. Для морской экономики нужны скорость, вместимость трюма, погрузка и правила причалов; «без лимита веса» требует уточнения.&quot;},{&quot;id&quot;:&quot;Q07&quot;,&quot;title&quot;:&quot;Снег и степь&quot;,&quot;text&quot;:&quot;Какие ресурсы, охота или приручение требуют этих биомов? Снег связан со Скитом и пещерами. Степь предлагаю оставить условной до выбора отдельного занятия.&quot;},{&quot;id&quot;:&quot;Q08&quot;,&quot;title&quot;:&quot;Острова и Навь&quot;,&quot;text&quot;:&quot;Китеж и Буян — позже. Навь за восточным кряжем — выбор эскиза. Объём обычной руды Китежа требует проверки экономики; морские подходы заменяют островам две наземные дороги.&quot;},{&quot;id&quot;:&quot;Q09&quot;,&quot;title&quot;:&quot;Выходы Черноречья&quot;,&quot;text&quot;:&quot;Две тропы к одной двери блокируются одним лагерем. Предлагаю разнести выходы и проверить внутреннюю связность. Транзит обходит данж; Пристани нужны причины для сбыта добычи вместо Острога.&quot;},{&quot;id&quot;:&quot;Q10&quot;,&quot;title&quot;:&quot;Дома и гильдии&quot;,&quot;text&quot;:&quot;Области жилья — резерв, не разрешённые участки. Нужны размеры домов и подъезды. Общие пути, причалы, ресурсы и входы нельзя перекрывать; контроль богатой шахты не должен закрывать обычную добычу.&quot;},{&quot;id&quot;:&quot;Q11&quot;,&quot;title&quot;:&quot;Внутренние области&quot;,&quot;text&quot;:&quot;12 мест охоты не равны 12 данжам: часть находится на поверхности. Вместимость служебной полосы проверяется по площади всех этажей, переходов и промежутков, а не только 12 квадратов 300 × 300.&quot;},{&quot;id&quot;:&quot;Q12&quot;,&quot;title&quot;:&quot;Время и диагонали&quot;,&quot;text&quot;:&quot;Геометрическая длина отличается от числа шагов UO. Для сегмента шаги оцениваются как max(|ΔX|, |ΔY|). Время при 5 и 10 шагах/с не учитывает остановки, препятствия и скорость гружёного каравана.&quot;},{&quot;id&quot;:&quot;Q13&quot;,&quot;title&quot;:&quot;Высоты и мосты&quot;,&quot;text&quot;:&quot;Высокий кряж — декоративный непроходимый массив; доступный перевал требует отдельного профиля. Для моста нужно проверить ширину, коллизии, видимость и уровни движения. Проход корабля под ним не подтверждён.&quot;},{&quot;id&quot;:&quot;Q14&quot;,&quot;title&quot;:&quot;Магия и груз&quot;,&quot;text&quot;:&quot;По сводке 1000 слитков весят 100 камней: обычный перегруз их не запрещает. Отдельный лимит нужно испытать вместе с повторными рейсами, Gate, группами, контейнерами и вьючными животными.&quot;},{&quot;id&quot;:&quot;Q15&quot;,&quot;title&quot;:&quot;Капища&quot;,&quot;text&quot;:&quot;Общие врата изменят поток игроков налегке. Предлагаю решать после проверки трёх сценариев и магических перевозок. На схеме врата не размещены.&quot;},{&quot;id&quot;:&quot;Q16&quot;,&quot;title&quot;:&quot;Лагеря и пустоты&quot;,&quot;text&quot;:&quot;Количество лагерей не гарантирует отсутствия пустых 500 × 500. Проверять проходимую сушу по занятиям. Каждой точке нужны назначение, риск, награда и связь с маршрутом.&quot;},{&quot;id&quot;:&quot;Q17&quot;,&quot;title&quot;:&quot;Границы мира&quot;,&quot;text&quot;:&quot;Как работают край карты и закрытие ещё не готовых земель? Служебная полоса должна быть недоступна обычному движению и кораблям. Контур очереди строительства не является игровым барьером.&quot;},{&quot;id&quot;:&quot;Q18&quot;,&quot;title&quot;:&quot;Первая очередь&quot;,&quot;text&quot;:&quot;Черноречье расширяет первую область ради третьего сценария; Пристань сначала малая. Групповое логово включено в Старые копи. Минимальный прототип — короткий круг Переброда, а не весь первый регион.&quot;},{&quot;id&quot;:&quot;Q19&quot;,&quot;title&quot;:&quot;Экспорт и нагрузка&quot;,&quot;text&quot;:&quot;По новой сводке большая карта клиента работает; риск остаётся в полном экспорте редактора. Проверить стыки, воду, коллизии и ревизии. Целевой онлайн подтверждается отдельными тестами толпы и рассредоточенных игроков.&quot;},{&quot;id&quot;:&quot;Q20&quot;,&quot;title&quot;:&quot;Рабочее имя&quot;,&quot;text&quot;:&quot;Ветлинские земли — название карты. The Verge можно использовать как рабочее имя проекта до окончательного выбора автором. Эскиз не переименовывает игру и старые материалы.&quot;}]&lt;/script&gt;

function el(tag,attrs={},text,parent=svg){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;parent.append(e);return e;}

for(const p of D.land)el(&#x27;polygon&#x27;,{points:pts(p),fill:&#x27;var(--background)&#x27;,stroke:&#x27;var(--muted-foreground)&#x27;,&#x27;stroke-width&#x27;:1},undefined,main);
for(const b of D.biomes)el(&#x27;polygon&#x27;,{points:pts(b.points),fill:b.kind===&#x27;forest&#x27;?&#x27;var(--green)&#x27;:b.kind===&#x27;snow&#x27;?&#x27;var(--blue)&#x27;:&#x27;var(--yellow)&#x27;,&#x27;fill-opacity&#x27;:b.kind===&#x27;forest&#x27;?.14:.1},undefined,main);
for(const b of D.blocked)el(&#x27;polygon&#x27;,{points:pts(b.points),fill:b.kind===&#x27;mountain&#x27;?&#x27;var(--muted-foreground)&#x27;:&#x27;var(--green)&#x27;,&#x27;fill-opacity&#x27;:b.kind===&#x27;mountain&#x27;?.22:.3},undefined,main);

}
